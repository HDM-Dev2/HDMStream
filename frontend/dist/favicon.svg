<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cameraGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d1fae5;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGradient)" />
  
  <!-- Inner Circle Border -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="#047857" stroke-width="2" />
  
  <!-- Camera Body -->
  <rect x="30" y="35" width="40" height="30" rx="5" fill="url(#cameraGradient)" />
  
  <!-- Camera Lens -->
  <circle cx="50" cy="50" r="10" fill="#065f46" />
  <circle cx="50" cy="50" r="6" fill="#047857" />
  <circle cx="50" cy="50" r="3" fill="#a7f3d0" />
  
  <!-- Camera Top Part -->
  <rect x="40" y="30" width="20" height="8" rx="2" fill="#d1fae5" />
  
  <!-- Signal Waves -->
  <path d="M 20 40 Q 25 35 30 40" stroke="#a7f3d0" stroke-width="2" fill="none" stroke-linecap="round" />
  <path d="M 20 45 Q 25 40 30 45" stroke="#a7f3d0" stroke-width="2" fill="none" stroke-linecap="round" />
  
  <!-- Streaming Dot -->
  <circle cx="72" cy="38" r="4" fill="#34d399">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
  </circle>
  
  <!-- HDM Text -->
  <text x="50" y="85" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold" font-family="Arial, sans-serif">
    HDM
  </text>
</svg>